[server]
listen = ":9999"
admin_listen = ":9998"
workers = 0  # 0 = auto (number of CPU cores)

[consul]
address = "127.0.0.1:8500"
scheme = "http"
token = ""
kv_prefix = "/sentirum-lb/routes"
tag_prefix = "urlprefix-"
poll_interval = "3s"
service_discovery = false
kv_watching = false

[proxy]
strategy = "round-robin"     # round-robin, random, least-connections
matcher = "prefix"           # prefix, iprefix, glob
request_id_header = "X-Request-ID"
no_route_status = 404
connect_timeout = "5s"
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "120s"
pool_size = 128              # upstream connection pool size per thread
max_connections = 10000      # max concurrent connections

[logging]
level = "info"               # trace, debug, info, warn, error
format = "text"              # text or json

[tls]
source = ""                  # "" auto-detects file mode when cert_path/key_path are set; or use "file" / "consul_kv"
cert_path = ""               # Path to PEM certificate when source=file
key_path = ""                # Path to PEM private key when source=file
listen = ""                  # TLS listen address (empty = HTTP port + 1)
consul_cert_prefix = "/fabio/cert"  # Fabio-compatible KV prefix when source=consul_kv
strict_sni = false            # true = handshake fails when no exact/wildcard SNI match exists
require_initial_snapshot = false  # true = fail startup unless first consul_kv TLS snapshot yields a valid cert
