name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ${{ vars.NEXUS_REGISTRY_ADDRESS }}
  IMAGE_NAME: sentirum-lb

jobs:
  build:
    name: Build & Push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Strip the leading `v` from the git tag (v1.5.0 -> 1.5.0) so the pushed
      # image tags match the registry convention used by the Nomad jobs.
      - name: Resolve version (strip v prefix)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.NEXUS_REGISTRY_ADDRESS }}
          username: ${{ vars.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.NEXUS_REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ vars.NEXUS_REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.NEXUS_REGISTRY_ADDRESS }}
          username: ${{ vars.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ vars.NEXUS_REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}"
          # Strip leading `v` (v1.5.0 -> 1.5.0) to match the registry convention.
          VERSION_TAG="${GITHUB_REF_NAME#v}"

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION_TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION_TAG}-amd64" \
            "${IMAGE}:${VERSION_TAG}-arm64"
