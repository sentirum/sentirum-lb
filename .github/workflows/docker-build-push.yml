name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ${{ vars.NEXUS_REGISTRY_ADDRESS }}
  IMAGE_NAME: sentirum-lb

jobs:
  build:
    name: Build & Push (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.NEXUS_REGISTRY_ADDRESS }}
          username: ${{ vars.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.NEXUS_REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ vars.NEXUS_REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.NEXUS_REGISTRY_ADDRESS }}
          username: ${{ vars.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ vars.NEXUS_REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}"
          VERSION_TAG="${GITHUB_REF_NAME}"

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION_TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION_TAG}-amd64" \
            "${IMAGE}:${VERSION_TAG}-arm64"
